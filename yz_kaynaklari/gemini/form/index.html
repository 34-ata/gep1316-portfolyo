<section class="contact-section">
  <h2>İletişim</h2>
  <form id="contactForm" class="contact-form" novalidate>
    <div class="form-group">
      <label for="name">Adınız</label>
      <input type="text" id="name" name="name" placeholder="Adınız Soyadınız" required>
      <small class="error-message" id="nameError"></small>
    </div>

    <div class="form-group">
      <label for="email">E-posta Adresiniz</label>
      <input type="email" id="email" name="email" placeholder="ornek@eposta.com" required>
      <small class="error-message" id="emailError"></small>
    </div>

    <div class="form-group">
      <label for="message">Mesajınız</label>
      <textarea id="message" name="message" rows="5" placeholder="Mesajınızı buraya yazın..." required></textarea>
      <small class="error-message" id="messageError"></small>
    </div>

    <button type="submit" class="submit-btn">Gönder</button>

    <div id="formStatus" class="form-status" role="status" aria-live="polite"></div>
  </form>
</section>
